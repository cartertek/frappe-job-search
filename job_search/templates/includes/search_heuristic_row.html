{% if (doc) { %}
<div style="min-width:0;max-width:100%;width:100%;box-sizing:border-box;white-space:normal;overflow-wrap:anywhere;padding:4px 8px 8px;">
  <div style="font-weight:600;margin-bottom:8px;">{%= frappe.utils.escape_html(doc.heuristic_name || "") %}</div>
  <div class="ql-editor read-mode" style="min-width:0;max-width:100%;width:100%;box-sizing:border-box;padding:0;white-space:normal;overflow-wrap:anywhere;overflow-x:hidden;height:auto;">
    {%= doc.description || "" %}
  </div>
</div>
{% } else { %}
<div style="padding:4px 8px;font-weight:600;">{%= __("Research Heuristic") %}</div>
{% } %}
