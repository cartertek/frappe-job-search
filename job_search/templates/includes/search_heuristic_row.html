{% if (doc) { %}
<div class="job-heuristic-record">
  <div class="job-heuristic-name">{%= frappe.utils.escape_html(doc.heuristic_name || "") %}</div>
  <div class="ql-editor read-mode job-heuristic-description">{%= doc.description || "" %}</div>
</div>
{% } else { %}
<style>
/* Make the native Frappe template a two-column table: built-in row selection
   and index on the left, the record contents filling the right column. */
.form-grid:has(.job-heuristic-record) .grid-body .data-row.row {
  width:100%;min-width:0;max-width:100%;display:flex;align-items:flex-start;
}
.form-grid:has(.job-heuristic-record) .grid-body .template-row-index {
  flex:0 0 58px;float:none;margin:0;padding:12px 8px;
  display:flex;align-items:center;gap:6px;
}
.form-grid:has(.job-heuristic-record) .grid-body .template-row-index span {
  display:inline;width:auto;margin:0;
}
.form-grid:has(.job-heuristic-record) .grid-body .template-row {
  flex:1 1 0;min-width:0;width:auto;max-width:none;padding:12px 16px;
}
.form-grid:has(.job-heuristic-record) .grid-heading-row > .grid-row:nth-child(2) {
  display:none;
}
.form-grid:has(.job-heuristic-record) .grid-heading-row.with-filter {height:32px;}
.job-heuristic-record {min-width:0;width:100%;overflow-wrap:anywhere;white-space:normal;}
.job-heuristic-name {font-weight:600;margin-bottom:8px;}
.job-heuristic-description.ql-editor.read-mode {
  width:100%;min-width:0;max-width:100%;height:auto;max-height:none;
  padding:0;white-space:normal;overflow-wrap:anywhere;
}
</style>
<div style="font-weight:600;">{%= __("Name / Description") %}</div>
{% } %}
