{% if (doc) { %}
<div class="job-search-heuristic-content">
  <div class="job-search-heuristic-name">{%= frappe.utils.escape_html(doc.heuristic_name || "") %}</div>
  <div class="ql-editor read-mode job-search-heuristic-description">{%= doc.description || "" %}</div>
</div>
{% } else { %}
<style>
/* Frappe renders both a heading row and a filter row for child grids. In
   template mode Frappe renders the filter even when it is not needed. */
.form-grid:has(.job-search-heuristic-content) .grid-heading-row > .grid-row + .grid-row {display:none;}
.form-grid:has(.job-search-heuristic-content) .grid-heading-row.with-filter {height:32px;}
/* Native template rows must use available width, not the ordinary grid's
   max-content width intended for horizontally scrolling data columns. */
.form-grid:has(.job-search-heuristic-content) .grid-body .data-row.row {
  width:100%;min-width:0;max-width:100%;position:relative;
}
.form-grid:has(.job-search-heuristic-content) .grid-body .template-row-index {
  position:absolute;float:none;left:10px;top:12px;margin:0;
}
.form-grid:has(.job-search-heuristic-content) .grid-body .template-row {
  width:calc(100% - 72px);max-width:calc(100% - 72px);min-width:0;
  margin-left:72px;box-sizing:border-box;
}
.job-search-heuristic-content {max-width:100%;min-width:0;overflow-wrap:anywhere;white-space:normal;}
.job-search-heuristic-name {font-weight:600;margin-bottom:8px;}
.job-search-heuristic-description.ql-editor.read-mode {
  width:100%;max-width:100%;min-width:0;height:auto;max-height:none;
  padding:0;overflow-wrap:anywhere;white-space:normal;
}
.job-search-heuristic-description.ql-editor.read-mode p,
.job-search-heuristic-description.ql-editor.read-mode li {
  white-space:normal;overflow-wrap:anywhere;
}
</style>
<div style="font-weight:600;">{%= __("Research Heuristic") %}</div>
{% } %}
