[project]
name = "job_search"
description = "Research and application workflow for Frappe CRM"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Cartertek LLC"}]
dependencies = []
dynamic = ["version"]

[build-system]
requires = ["flit_core>=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
