name: Job Search App CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install checks
        run: python -m pip install --upgrade ruff build
      - name: Ruff lint
        run: ruff check .
      - name: Compile Python
        run: python -m compileall -q job_search tests
      - name: Validate schema contracts
        run: python -m unittest discover -s tests -v
      - name: Build package
        run: python -m build --sdist --wheel
